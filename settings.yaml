# FunASR_e2e 端到端流程配置文件。
# 所有相对路径均相对于 FunASR_e2e 项目根目录解析。

paths:
  # 待处理音频目录。batch 模式下会扫描该目录。
  input_audio_dir: input_audio
  # 输出目录。默认每个音频会在 output 下创建独立子目录。
  output_dir: output
  # API 密钥配置文件。
  env_file: .env
  # 清洗规则和 LLM prompt 所在目录。
  prompt_dir: prompt

audio:
  # batch: 处理 input_audio_dir 下所有支持格式音频。
  # single: 只处理 input_audio_file 指定的单个音频。
  mode: batch
  # 指定单个音频；为空时扫描 input_audio_dir。
  input_audio_file: null
  supported_extensions:
    - .wav
    - .mp3
    - .m4a
    - .flac
    - .aac
    - .ogg

funasr:
  model: iic/speech_seaco_paraformer_large_asr_nat-zh-cn-16k-common-vocab8404-pytorch
  vad_model: iic/speech_fsmn_vad_zh-cn-16k-common-pytorch
  punc_model: iic/punc_ct-transformer_cn-en-common-vocab471067-large
  spk_model: iic/speech_campplus_sv_zh-cn_16k-common
  # null 时由模型自动聚类；明确人数时填写正整数，例如 2。
  preset_spk_num: null
  # cuda / cpu / mps / xpu / npu。无 GPU 时可改为 cpu。
  device: cpu
  batch_size_s: 300
  batch_size_threshold_s: 60
  max_single_segment_time: 60000

postprocess:
  max_gap_ms: 2000
  max_chars: 400
  speaker_prefix: 说话人
  keep_time: true

llm:
  skip_polish: false
  provider: dashscope
  # 必须保持 null；实际模型严格读取 .env 中的 MODEL_NAME。
  model: null
  chunk_size: 8
  max_workers: 8
  max_retries: 3
  enable_thinking: false
  api_key_env: API_KEY
  base_url_env: BASE_URL
  model_name_env: MODEL_NAME
  polished_suffix: _polished
  final_suffix: _final
  final_audit_suffix: _final_audit

speaker_review:
  # 只调整说话人归属和原文切片，不改写原始 ASR 字符。
  enabled: true
  enable_thinking: false
  # 必须保持 null，实际模型严格读取 .env 中的 MODEL_NAME。
  model: null
  # 高风险片段两侧的只读上下文句数。
  context_size: 4
  # 单个高风险连续片段最多包含的核心句数。
  max_risk_core_sentences: 12
  # 仅对疑似句内换人的核心句提供的最大边界数。
  max_boundary_candidates: 16
  max_workers: 8
  max_retries: 3
  request_timeout_s: 90
  auto_apply_confidence: 0.90
  # null 时从当前音频的 FunASR 匿名 speaker 标签自动派生。
  allowed_speakers: null
  unknown_label: unknown
  overlap_label: overlap
  # fail_closed / keep_original。失败时保留当前 FunASR 或已接受的 baseline。
  failure_policy: keep_original
  api_key_env: API_KEY
  base_url_env: BASE_URL
  model_name_env: MODEL_NAME
  review_json_suffix: _speaker_review
  reviewed_suffix: _reviewed

output:
  # true: 每个音频输出到 output/<音频名>/，避免多音频结果混在一起。
  per_audio_subdir: true
  # true: 已存在同名输出时覆盖。
  overwrite: true
